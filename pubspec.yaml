name: farmerconnect
description: "KisanConnect - AI-Powered Agricultural Marketing App | Syngenta Hackathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.4

  # State Management
  provider: ^6.1.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Localization
  easy_localization: ^3.0.7

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3

  # Image
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
